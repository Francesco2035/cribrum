[project]
name = "cribrum"
version = "0.1.0"
description = "Offline semantic search and an Obsidian topic graph over Telegram group chats"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Francesco", email = "francescorausa203@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bertopic>=0.17.4",
    "chromadb>=1.5.9",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "typer>=0.27.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
